# Adapter: Astryx (Meta) — @astryxdesign/cli
#
# Astryx is self-describing: `astryx manifest --json` returns every command,
# argument and response discriminator. Where this file and the live manifest
# disagree, the manifest wins — run /speckit.designsys.sync --refresh to
# re-derive the mapping from it.
#
# Response envelope: { "type": "<discriminator>", "data": { ... } }
# Errors carry stable codes, e.g. ERR_UNKNOWN_COMPONENT.

id: astryx
name: "Astryx"
bin: "npx astryx"

# Appended to every invocation. Add --dense here if you want Astryx's compressed
# output; the gate runs on every feature, so response size is worth tuning.
global_args: ["--json"]

envelope:
  type_key: "type"
  data_key: "data"
  error_code_key: "code"

capabilities:
  describe:
    args: ["manifest"]
    result_path: "data"

  search:
    # Ranked across components, hooks, docs and templates in one call — this is
    # the single most valuable call for the reuse ladder.
    args: ["search", "{query}", "--detail", "compact"]
    result_path: "data"
    response_type: "search"

  list_components:
    args: ["component", "--list"]
    result_path: "data"

  component:
    args: ["component", "{name}", "--detail", "full"]
    result_path: "data"
    response_type: "component.detail"
    not_found_codes: ["ERR_UNKNOWN_COMPONENT"]

  pattern:
    # Astryx calls composed patterns "templates".
    args: ["template", "{name}"]
    result_path: "data"
    not_found_codes: ["ERR_UNKNOWN_TEMPLATE"]

  tokens:
    args: ["theme", "export", "{theme}"]
    result_path: "data"
    defaults:
      theme: "default"

  extend:
    # swizzle copies component source for legitimate customization — this is the
    # Extend rung, and it is deliberately a real command rather than advice.
    args: ["swizzle", "{name}", "--dry-run"]
    result_path: "data"

  report_gap:
    # gap-report routes a design-system gap to its owning package, so the Create
    # rung feeds the design system's own intake instead of dead-ending in a doc.
    args: ["gap-report", "--title", "{title}", "--body", "{body}"]
    result_path: "data"
