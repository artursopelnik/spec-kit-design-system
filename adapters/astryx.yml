# Adapter: Astryx (https://astryx.atmeta.com)
#
# Astryx is a design system built to be read by agents: every command takes
# `--json` and emits a typed envelope, and `manifest` describes the whole
# command surface. That makes it close to a one-to-one fit for the capability
# contract, including its own guidelines via `docs principles`.
#
#   npm install -D @astryxdesign/cli
#
#   # design-config.yml
#   adapter: astryx
#   bin: "npx astryx"          # or "node node_modules/@astryxdesign/cli/clients/cli/bin/astryx.mjs"
#
# If a flag here stops working, ask the CLI rather than this file:
#   ds.sh query describe      ->  astryx manifest --json
# and update the mapping from what the manifest actually reports.

id: astryx
name: "Astryx"

bin: "npx astryx"
global_args: ["--json"]

envelope:
  type_key: "type"
  data_key: "data"
  error_code_key: "code"

capabilities:
  describe:
    args: ["manifest"]
    result_path: "data"

  search:
    # `--detail compact` keeps the response small enough to read many hits at
    # once; pull full detail only on the ones worth pursuing.
    args: ["search", "{query}", "--detail", "compact"]
    result_path: "data"

  list_components:
    args: ["component", "--list"]
    result_path: "data"

  component:
    args: ["component", "{name}"]
    result_path: "data"

  pattern:
    # Astryx calls composed arrangements templates.
    args: ["template", "{name}"]
    result_path: "data"

  tokens:
    args: ["docs", "tokens"]
    result_path: "data"

  guidelines:
    # The system speaking for itself. When this answers, it is the authority for
    # the run and the default guidelines shipped with this extension go unread.
    args: ["docs", "principles"]
    result_path: "data"

  extend:
    # Copy a component's source for sanctioned local modification: rung 4.
    args: ["swizzle", "{name}"]
    result_path: "data"

  report_gap:
    args: ["gap-report"]
    result_path: "data"

  # breakpoints: unmapped. Astryx states them in its token documentation, which
  # `tokens` already returns, so a separate call would ask the same question
  # twice. Map it here if your theme puts them somewhere else.
