# Adapter: Radix UI (https://www.radix-ui.com)
#
# Radix UI has no CLI that answers "what components exist and what is this one",
# which is what the reuse ladder needs. So this adapter reads an inventory file
# your project generates, exactly like `static-json`, and exists so that
# `adapter: radix` names the system you use and `auto` can pick it from
# `radix-ui or @radix-ui/react-*` in package.json.
#
#   # design-config.yml
#   adapter: radix
#   source: ".design-system/inventory.json"   # default
#
# Radix ships unstyled primitives, so list your own styled wrappers as `components` and record the primitive each one composes in `patterns`. Tokens live in whatever styling layer you put on top.
#
# The inventory shape is documented in `static-json.yml`. Generate it from
# Storybook, your component metadata, or a short build script, and commit it or
# build it in CI. Include "breakpoints": responsive requirements are written
# using those names, and a name the agent cannot look up is a name it will invent.

id: radix
name: "Radix UI"
bin: ""

source: ".design-system/inventory.json"

capabilities:
  search:
    # Matched in-process against name, description and usage fields.
    read_file: "{source}"
    search_keys: ["components", "patterns"]
    match_fields: ["name", "description", "usage"]

  list_components:
    read_file: "{source}"
    result_path: "components"

  component:
    read_file: "{source}"
    result_path: "components"
    key_field: "name"

  pattern:
    read_file: "{source}"
    result_path: "patterns"
    key_field: "name"

  tokens:
    read_file: "{source}"
    result_path: "tokens"

  breakpoints:
    read_file: "{source}"
    result_path: "breakpoints"

  guidelines:
    # Your design system's own principles, if you put them in the inventory.
    # Prose is fine; this is the system speaking for itself, so when this
    # answers it becomes the authority for the run and the default guidelines
    # shipped with the extension are not read.
    #
    # A separate file works too, and is usually easier to maintain:
    #   # design-config.yml
    #   guidelines:
    #     source: "node_modules/@acme/design-system/guidelines.yml"
    read_file: "{source}"
    result_path: "guidelines"

  # extend / report_gap: unmapped, because a static inventory has no write side.
