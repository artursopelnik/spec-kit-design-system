# Spec Kit Design System: project configuration
#
# This file says how to reach YOUR design system. That is all it is for. The
# extension models no design system of its own, it only knows how to ask, and
# everything else has a working default.
#
# For most projects the whole file is one line.

# Which adapter to load from .specify/extensions/design/adapters/<id>.yml
#
#   auto          detect it (the default): components.json -> shadcn,
#                 @mui/material, antd, @chakra-ui/react, @ark-ui/react,
#                 radix-ui / @radix-ui/* in package.json, otherwise static-json.
#                 Leave this alone unless detection picks wrong.
#   shadcn        the shadcn/ui CLI
#   mui, antd, chakra, radix, ark-ui
#                 read a generated inventory file, like static-json
#   static-json   no CLI needed; reads a generated inventory file (the default)
#   example       a template to copy and rename for your own CLI
#   custom        define everything inline under `capabilities:` below
adapter: auto

# Override the binary the adapter invokes. Leave empty to use the adapter's own.
# Split on whitespace, so wrappers work:
#   "npm run ds --"  ·  "pnpm --filter @acme/web exec ds"  ·  "./bin/ds"
bin: ""

# Working directory for the design system, relative to repo root. Empty = repo
# root. Both CLI calls and file lookups resolve against it, so a monorepo can
# point at one package.
cwd: ""

# static-json only: where the inventory lives. Empty uses the adapter default
# (.design-system/inventory.json).
# source: "node_modules/@acme/design-system/inventory.json"

# --- everything below is optional --------------------------------------------

# Guidelines are resolved in one order, and the first source that answers wins
# outright:
#
#   1. your design system's CLI       (`guidelines` capability)
#   2. static data it ships           (inventory key, or the file named here)
#   3. the small default set in guidelines/default.yml
#
# They are never merged. A design system that states its own guidelines should
# not also inherit ours. You normally configure nothing here.
#
# guidelines:
#   # A guidelines file your design system publishes. Resolved next to this
#   # config, or from the repo root, so it can live inside the package itself.
#   source: "node_modules/@acme/design-system/guidelines.yml"
#   # false runs with no guidelines at all, rather than with the default set.
#   default: true
#   # Ids to switch off. Reported in the spec with a reason, never dropped
#   # silently. Run `ds.sh guidelines` to see the ids currently in force.
#   disabled: []

# The design system version in use. Prior decisions taken against a different
# one are flagged stale rather than reused silently. Leave empty and staleness
# simply is not checked, which lookups report rather than implying freshness.
# design_system_version: ""

# Capability overrides. The extension is written against capability names only;
# the adapter maps each to a real invocation. Anything unmapped degrades rather
# than failing. Override one when your CLI differs from the shipped adapter:
#
# capabilities:
#   search:
#     args: ["search", "{query}", "--json", "--detail", "compact"]
#     result_path: "data.results"
#   tokens:
#     read_file: "design/tokens.json"
#   # Where one command answers two questions - most systems state their
#   # breakpoints inside the token payload - carve out the slice, or
#   # `breakpoints` answers with the whole token set and every phase that asks
#   # pays for it twice. `result_paths` takes the first candidate that resolves;
#   # `pick` keeps named keys. `ds.sh context plan --json` reports the size of
#   # each section, and says so in `notes` when an answer arrives unnarrowed.
#   breakpoints:
#     args: ["tokens"]
#     result_paths: ["data.breakpoints", "data.screens"]

# workflow:
#   # How many validate -> fix rounds before the run stops and asks for a human.
#   max_validation_rounds: 3

# gate:
#   # false lets the ladder run and record findings without blocking planning.
#   # Useful while adopting.
#   enforce: true
