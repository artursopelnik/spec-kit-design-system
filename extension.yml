schema_version: "1.0"

extension:
  id: design
  name: "Spec Kit Design System"
  version: "0.1.0"
  description: "Give it an RFC. It runs the Spec Kit workflow and implements the change using your design system."
  category: integration
  effect: read-write
  author: "artursopelnik"
  repository: https://github.com/artursopelnik/spec-kit-design-system
  homepage: https://github.com/artursopelnik/spec-kit-design-system
  license: MIT

requires:
  # Verified against 1.0.9.dev0. Earlier versions are untested rather than known
  # broken. A floor of 0.1.0 was claimed before anything was actually installed,
  # which is the failure mode that makes catalog entries unusable.
  speckit_version: ">=1.0.0,<2.0.0"
  # No tools are declared here. The design system CLI is named in
  # design-config.yml instead, because it differs per project (shadcn, an
  # in-house binary, or no CLI at all), and declaring one would imply
  # a dependency this extension does not have.

provides:
  commands:
    # The one a developer needs to know. Everything below it is the machinery
    # this drives, and it is also what the hooks fire.
    - name: speckit.design.run
      file: commands/speckit.design.run.md
      description: "Take an RFC and run it to done: clarify, specify, plan, implement, validate, fix, verify"

    - name: speckit.design.context
      file: commands/speckit.design.context.md
      description: "Resolve principles and design system context into the specification"

    - name: speckit.design.check
      file: commands/speckit.design.check.md
      description: "Run the Recall -> Reuse -> Compose -> Extend -> Create ladder and gate the plan on its outcome"

    - name: speckit.design.validate
      file: commands/speckit.design.validate.md
      description: "Check the implementation independently and raise findings that feed back into fixing"

  config:
    - name: "design-config.yml"
      template: "config-template.yml"
      description: "Which design system adapter to use. Usually three lines."
      required: true

hooks:
  # The phases are wired here, not in the run command, so they also hold for
  # anyone driving spec-kit by hand. /speckit.design.run is the autonomous
  # path over the same rails, not a second implementation of them.
  after_specify:
    command: speckit.design.context
    optional: false
    description: "Resolve principles and design system context for the new specification"

  # The gate. Planning must not begin until the reuse ladder has been walked.
  before_plan:
    command: speckit.design.check
    optional: false
    priority: 5
    description: "Enforce Recall -> Reuse -> Compose -> Extend -> Create before planning"

  # Independent validation closes the loop, and its findings drive the fix pass.
  after_implement:
    command: speckit.design.validate
    optional: false
    description: "Validate the implementation against the spec, the principles and the design system"

tags:
  - "design-system"
  - "design-tokens"
  - "accessibility"
  - "autonomous"
  - "reuse"

config:
  defaults:
    # Which adapter under adapters/ describes the project's design system.
    # "auto" detects one from the project (components.json -> shadcn,
    # a known component library in package.json, else static-json).
    # Name one to pin it.
    adapter: auto

    principles:
      # Fall back to the small default set when the design system supplies no
      # principles of its own. Set false to run with none rather than ours.
      default: true
      # Principle ids to switch off. Reported, never hidden.
      disabled: []

    workflow:
      # Validate -> fix -> validate, bounded. When findings survive this many
      # rounds the run stops and says so instead of looping.
      max_validation_rounds: 3

    ledger:
      # Consult prior ladder decisions before querying the design system, and
      # record each new one. Without this, every feature re-litigates settled
      # questions against an empty context.
      enabled: true
      # Minimum token-overlap score for a prior decision to be surfaced.
      match_threshold: 0.34
      # Re-validate a prior decision when the design system has moved on since
      # it was taken. A cached decision against a stale inventory is worse than
      # no decision, because it looks authoritative.
      revalidate_when_stale: true

    gate:
      # Block planning when the ladder was not walked or its rungs are unjustified.
      enforce: true
      # Minimum number of existing candidates that must be considered before
      # a rung may be rejected.
      min_candidates_considered: 3

    validation:
      # Fail validation on hardcoded values where a token exists.
      forbid_raw_values: true
      # Dimensions every UI feature must answer for.
      required_dimensions:
        - states
        - responsive
        - accessibility
        - tokens
        - interaction
