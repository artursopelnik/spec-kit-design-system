schema_version: "1.0"

# Acme's own guidelines. They ship inside the design system package, so every
# consuming repository reads this same file, and the design system owns them.
#
# When these resolve, they ARE the guidelines for the run: the default set that
# ships with the extension is not merged in and not consulted.

prose: |
  Acme is a compact, keyboard-first system. Prefer the smallest component that
  carries the meaning. Filters belong in a FilterBar; overlays are chosen by the
  kind of decision they ask for, not by how much room the content needs.

rules:
  - id: ACME-TARGET-SIZE
    dimension: accessibility
    applies_to: interactive
    requirement: >-
      Pointer targets MUST be at least 44x44px including padding, and adjacent
      targets MUST be separated by at least space.2.
    verify: "Measure the hit area, not the visible box, at every breakpoint."
    standard: "WCAG 2.5.8"

  - id: ACME-OVERLAY-CHOICE
    dimension: interaction
    applies_to: interactive
    requirement: >-
      Destructive or irreversible confirmations MUST use Modal. Drawer MUST NOT
      be used to confirm a destructive action.
    verify: "Each overlay's component matches the kind of decision it asks for."
    standard: null

  - id: ACME-LABEL-REQUIRED
    dimension: accessibility
    applies_to: interactive
    requirement: >-
      Every form control MUST be paired with a Label. Placeholder text MUST NOT
      be used as the only label.
    verify: "Each control has an associated Label element."
    standard: "WCAG 3.3.2"

  - id: ACME-MOTION-BUDGET
    dimension: interaction
    applies_to: motion
    requirement: >-
      Transitions MUST reference a duration token and MUST NOT exceed
      duration.base.
    verify: "Every transition uses duration.fast or duration.base."
    standard: null
