name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Spec Kit moves fast. A weekly run catches upstream changes that break the
    # install path before a user hits them — the failure mode where a catalog
    # entry silently becomes unusable on a newer release.
    - cron: "0 6 * * 1"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest

      - name: Check shell scripts parse
        run: for f in scripts/bash/*.sh examples/*.sh; do bash -n "$f"; done

      - name: Check YAML parses
        run: |
          for f in extension.yml config-template.yml adapters/*.yml guidelines/*.yml \
                   preset/preset.yml benchmarks/systems/*/*.yml benchmarks/cases/*/case.yml; do
            python -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done

      - name: Benchmark harness runs end to end
        run: |
          # No agent: the harness builds the workspace, scores the starting point
          # and reports on it. Catches a broken case or scorer without spending a
          # model call.
          python benchmarks/harness/runner.py --case toolbar-mobile --arm unaided \
            --no-agent --score --label ci --out "$RUNNER_TEMP/bench" > /dev/null
          python benchmarks/harness/score.py \
            --run "$RUNNER_TEMP/bench/toolbar-mobile/unaided/ci-01" > /dev/null
          python benchmarks/harness/report.py "$RUNNER_TEMP/bench" | head -20

  format:
    name: Prettier (docs and adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Scope lives in .prettierignore; commands/*.md are deliberately excluded.
      - name: Check formatting
        run: npx --yes prettier@3 --check docs adapters

  integration:
    name: Real install against Spec Kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: extension

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Spec Kit
        run: pip install specify-cli

      - name: Report versions under test
        run: specify --version

      - name: Initialize a throwaway project
        run: |
          specify init proj --integration claude --non-interactive --ignore-agent-tools

      - name: Install the extension and preset
        working-directory: proj
        run: |
          specify extension add --dev "$GITHUB_WORKSPACE/extension"
          specify preset add --dev "$GITHUB_WORKSPACE/extension/preset"

      - name: Manifests validate against Spec Kit's own validator
        working-directory: proj
        run: |
          python - <<'PY'
          from specify_cli.extensions import ExtensionManifest
          import specify_cli.presets as presets
          ExtensionManifest(".specify/extensions/design/extension.yml")
          presets.PresetManifest(".specify/extensions/design/preset/preset.yml")
          print("manifests valid")
          PY

      - name: Hooks are registered
        working-directory: proj
        run: |
          python - <<'PY'
          import sys, yaml
          registry = yaml.safe_load(open(".specify/extensions.yml"))
          hooks = registry.get("hooks", {})
          for event in ("after_specify", "before_plan", "after_implement"):
              entries = hooks.get(event) or []
              assert entries, f"{event} not registered"
              assert entries[0]["extension"] == "design", entries
          gate = hooks["before_plan"][0]
          # The gate is worthless if it is skippable.
          assert gate["optional"] is False, gate
          print("hooks registered; before_plan is blocking")
          PY

      - name: Preset append composition actually composes
        working-directory: proj
        run: |
          python - <<'PY'
          import json, subprocess

          expectations = {
              "spec-template": ("## Requirements", "## Design System Requirements"),
              "plan-template": ("## Constitution Check", "## Design System Check"),
              "constitution-template": ("## Core Principles", "Reuse"),
          }
          for template, (core, appended) in expectations.items():
              out = subprocess.run(
                  [".specify/scripts/bash/resolve-template.sh", template, "--json"],
                  capture_output=True, text=True, check=True,
              ).stdout
              content = json.loads(out)["TEMPLATE_CONTENT"]
              assert core in content, f"{template}: core content lost -> {core}"
              assert appended in content, f"{template}: addendum missing -> {appended}"
              print(f"{template}: core preserved, addendum appended")
          PY

      - name: Scripts run from the installed location
        working-directory: proj
        run: |
          printf 'adapter: static-json\n' > .specify/extensions/design/design-config.yml
          .specify/extensions/design/scripts/bash/ds.sh gate --json \
            | python -c "import json,sys; d=json.load(sys.stdin); print('gate ok, adapter', d['ADAPTER'])"

      - name: Default guidelines load and filter when the system supplies none
        working-directory: proj
        run: |
          DS=.specify/extensions/design/scripts/bash/ds.sh
          $DS guidelines --json > all.json
          $DS guidelines --json --applies-to text > text.json
          python - <<'PY'
          import json
          every = json.load(open("all.json"))
          text = json.load(open("text.json"))
          assert every["source"] == "default", every["source"]
          assert every["rules"], every
          assert len(text["rules"]) < len(every["rules"]), "filtering did nothing"
          unconditional = {r["id"] for r in every["rules"] if r["applies_to"] == "any"}
          assert unconditional <= {r["id"] for r in text["rules"]}, "an unconditional rule was filtered away"
          print(f"defaults ok: {len(every['rules'])} guidelines, {len(text['rules'])} apply to text")
          PY

      - name: The example walkthrough still works
        run: |
          "$GITHUB_WORKSPACE/extension/examples/setup-demo.sh" "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          DS=.specify/extensions/design/scripts/bash/ds.sh
          $DS gate --json > gate.json
          $DS query search "confirm destructive action" --json > search.json
          $DS guidelines --applies-to interactive,layout --json > guidelines.json
          $DS context implement --json > context.json
          python - <<'PY'
          import json
          gate = json.load(open("gate.json"))
          assert gate["REACHABLE"] is True, gate
          # Acme publishes its own guidelines, so ours are never consulted.
          assert gate["GUIDELINES_SOURCE"] == "adapter", gate

          hits = json.load(open("search.json"))["data"]
          # Ranking has to be meaningful, not insertion order: the pattern built
          # for destructive confirmation must outrank a generic Button.
          assert hits[0]["name"] == "ConfirmDialog", [h["name"] for h in hits]
          assert len({h["score"] for h in hits}) > 1, hits

          guidelines = json.load(open("guidelines.json"))
          ids = {r["id"] for r in guidelines["rules"]}
          assert ids and all(i.startswith("ACME-") for i in ids), ids
          assert "keyboard-first" in guidelines["prose"], guidelines["prose"]

          context = json.load(open("context.json"))
          # Focused: no component arrives unasked for. Not restricted: every
          # capability is advertised with the call that retrieves it.
          assert context["components"] == {}, context["components"]
          assert "ConfirmDialog" not in json.dumps(context)
          assert "component" in context["available_on_demand"], context
          print("walkthrough ok")
          PY

      - name: The demo wires up a real design system too
        run: |
          "$GITHUB_WORKSPACE/extension/examples/setup-demo.sh" "$RUNNER_TEMP/shadcn-demo" \
            --system shadcn --case date-range-filter
          cd "$RUNNER_TEMP/shadcn-demo"
          DS=.specify/extensions/design/scripts/bash/ds.sh
          $DS gate --json > gate.json
          $DS query component Calendar --json > calendar.json
          python - <<'PY'
          import json
          gate = json.load(open("gate.json"))
          assert gate["REACHABLE"] is True, gate
          # shadcn publishes no rules of its own, so the house file has to be
          # what answers, not the extension's defaults.
          assert gate["GUIDELINES_SOURCE"] == "adapter", gate

          calendar = json.load(open("calendar.json"))
          assert calendar["found"] is True, calendar
          assert "range" in json.dumps(calendar["data"]), calendar
          assert open("rfc.md").read().startswith("# RFC:")
          print("shadcn demo ok")
          PY

      - name: The autonomous workflow reports where it is
        working-directory: proj
        run: |
          DS=.specify/extensions/design/scripts/bash/ds.sh
          printf '# RFC: Filter bookings\n\n## Problem\nUsers scroll.\n\n## Proposal\nA date range control above the list.\n' > rfc.md
          $DS rfc rfc.md --json > rfc.json
          $DS workflow status --json > status.json
          python - <<'PY'
          import json
          rfc = json.load(open("rfc.json"))
          assert rfc["title"].startswith("RFC:"), rfc
          assert rfc["ui_bearing"] is True, rfc
          status = json.load(open("status.json"))
          # No feature yet, so the run starts by specifying one.
          assert status["next"] == "specify", status
          print("workflow status ok")
          PY

      - name: Gate fails closed when the design system is unreachable
        working-directory: proj
        run: |
          printf 'adapter: example\nbin: "./not-installed"\n' \
            > .specify/extensions/design/design-config.yml
          # Capture to a file rather than piping: a heredoc would otherwise take
          # over stdin and the gate output would never reach the checker.
          .specify/extensions/design/scripts/bash/ds.sh gate --json > gate.json
          python - <<'PY'
          import json
          payload = json.load(open("gate.json"))
          assert payload["REACHABLE"] is False, payload
          assert payload["CAPABILITIES"] == [], payload
          # The adapter file declares a full contract; none of it is reachable.
          assert len(payload["MAPPED_CAPABILITIES"]) > 0, payload
          print("fail-closed confirmed")
          PY
