# Two features in one workspace, the second needing a surface the first has
# already settled.
#
# Feature 1 has to work out how to pick a date range on shadcn (Calendar inside
# Popover). Feature 2 asks for the same surface for invoices, worded differently.
# Every arm runs both features back to back; only the extension arm has a ledger
# to carry the first answer into the second.
#
# Scored like any other case, arm-neutrally: both surfaces have to land on what
# the system offers. What the ledger is supposed to change is the cost of getting
# there, so the runner records usage per feature and in total, and the report
# prints it beside the score. Whether the second feature cited a ledger decision
# is an extension-only artifact, observed as `decisions_cited` and never scored.

id: period-filter-sequence
title: "Period selection across features (ledger benchmark)"
kind: ledger-test
design_system: shadcn

features:
  - id: feature1
    rfc: feature1/rfc.md
    title: "Narrow the booking list by period"
    surfaces:
      - id: period-selection
        capability: "choosing a start and an end date"
        expected_resolution: compose-components
        rationale: >-
          No component covers it, so rung 1 fails honestly. Calendar with
          mode="range" inside a Popover does, and the registry documents that
          composition, so rung 3 is the lowest that holds.
        satisfied_by:
          - [Calendar, Popover]
          - [Calendar, Popover, Button]
        forbidden:
          - pattern: '<input[^>]*type=["'']date'
            because: "native date inputs drop the theme"

  - id: feature2
    rfc: feature2/rfc.md
    title: "Filter invoices by billing period"
    surfaces:
      - id: period-selection
        capability: "selecting a start and end date for the filter"
        expected_resolution: compose-components
        rationale: >-
          The same need as feature 1, so the same composition is the answer.
          Landing somewhere else is the drift the ledger exists to prevent.
        satisfied_by:
          - [Calendar, Popover]
          - [Calendar, Popover, Button]
        forbidden:
          - pattern: '<input[^>]*type=["'']date'
            because: "native date inputs drop the theme"

# A principle counts as carried when any one of its evidence patterns appears in
# the produced work.
principles:
  - id: SHADCN-THEME-TOKENS
    evidence:
      - 'var\(--'
      - '\b(?:bg|text|border|ring)-(?:background|foreground|muted|primary|secondary|accent|destructive|border|input|ring)'
  - id: SHADCN-BREAKPOINT-NAMES
    evidence:
      - '\b(?:sm|md|lg|xl):'
      - '\bbreakpoint'

# Both RFCs ask for these.
criteria:
  - text: "An end before the start is refused"
    evidence:
      - '(?i)end .{0,30}before .{0,30}start'
      - '(?i)invalid (?:period|range)'
  - text: "The chosen period survives a reload"
    evidence:
      - '(?i)(?:survives|persist\w*|restored).{0,40}(?:reload|refresh)'
      - '(?i)(?:search ?param|query string|url state|localStorage)'
  - text: "Operable from the keyboard alone"
    evidence:
      - '(?i)keyboard'
      - '(?i)focus (?:order|trap|return)'
  - text: "Usable down to a 375 pixel wide viewport"
    evidence:
      - '(?i)375'
      - '(?i)(?:mobile|small screen|narrow viewport)'

# The pages the two RFCs are about, always scored. Each lives in its own
# feature's seed: a later seed is staged over the earlier run's work, so the two
# must never share a file.
always_score:
  - src/app/bookings/page.tsx
  - src/app/invoices/page.tsx
