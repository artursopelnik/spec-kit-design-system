# Harness metadata for the shadcn workspace. The inventory next to this file is
# the design system artifact; this file is only how the benchmark wires and
# scores it, and nothing here is read at runtime by the extension.

id: shadcn
name: "shadcn/ui"
adapter: static-json
inventory: inventory.json
principles: principles.yml

# Written into the workspace so both arms see the same design system in the
# same place.
install:
  inventory_path: ".design-system/inventory.json"
  principles_path: ".design-system/principles.yml"

stack: "React + TypeScript + Tailwind, components copied under src/components/ui"

# What counts as reaching for the system's styling layer rather than a literal
# value. Used by the token_discipline metric.
# Imports from here are claims about the design system: a name imported from one
# of these and absent from the inventory is a component the run invented. A name
# imported from anywhere else is a dependency decision, not a claim, and is left
# out of the fidelity count.
ds_module_pattern: "@/components/ui|components/ui|\\.\\./ui/|@/registry"

token_signals:
  - "var\\(--[a-z-]+\\)"
  - "\\b(?:bg|text|border|ring|fill|stroke)-(?:background|foreground|card|popover|primary|secondary|muted|accent|destructive|border|input|ring)(?:-foreground)?\\b"
  - "\\b(?:p|px|py|pt|pb|pl|pr|m|mx|my|gap|space-[xy])-(?:0|0\\.5|1|1\\.5|2|2\\.5|3|4|5|6|8|10|12|16)\\b"
  - "\\b(?:sm|md|lg|xl|2xl):"
  - "\\brounded-(?:sm|md|lg|xl|full)\\b"

# Literal values that are not a finding: hairlines, zero, and full-width.
raw_value_allow: ["0", "1px", "2px", "100%"]

# Names that are not design system components when they turn up unknown.
ignore_refs: ["Link", "Head", "Image", "Script", "Outlet", "Route", "Routes", "Providers"]
