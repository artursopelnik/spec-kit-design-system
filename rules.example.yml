schema_version: "1.0"

# House rules: what YOUR design system requires.
#
# Copy this file to `rules.yml` next to your `designsys-config.yml` and replace
# the examples. Everything below is illustrative; none of it describes a real
# design system.
#
# The baseline that ships with the extension holds what every design system
# wants, and deliberately carries no numbers. This file is where the numbers
# live, because the numbers are exactly what design systems disagree about.
# Two systems both want adequate touch targets; one says 44px and one says 48px.
# Only you know which.
#
# Two things you can do here:
#
#   ADD a rule your system has and the baseline does not. Use your own id
#   prefix so it is obvious where it came from.
#
#   OVERRIDE a baseline rule by reusing its id. The baseline rule is replaced
#   entirely. This is how you tighten the floor, and it is better than disabling
#   the baseline rule and writing a separate one, because the id stays stable
#   and anything already citing it keeps working.
#
# Fields are the same as baseline.yml:
#   id          stable and citable; specs reference this rather than the text
#   dimension   accessibility | responsive | interaction | states | tokens
#   applies_to  interactive | layout | text | media | motion | any
#   requirement the MUST statement, written so it can be a spec requirement
#   verify      how the audit checks it
#   standard    a WCAG criterion where one applies, otherwise null
#
# Keep `requirement` normative (use MUST / MUST NOT) and keep `verify`
# concrete. A rule nobody can check is a preference, not a rule.

rules:
  # --- Overriding a baseline rule ---------------------------------------------
  # Same id as the shipped rule, so it replaces it. Here the system commits to a
  # larger target than the baseline's "large enough to hit reliably".

  - id: BL-A11Y-TARGET-SIZE
    dimension: accessibility
    applies_to: interactive
    requirement: >-
      Pointer targets MUST be at least 48x48px, including padding. Adjacent
      targets MUST be separated by at least one spacing step.
    verify: "Measure the hit area, not the visible box, at every breakpoint."
    standard: "WCAG 2.5.8"

  # Tightening contrast from the baseline's "at minimum AA" to AAA.
  - id: BL-A11Y-CONTRAST
    dimension: accessibility
    applies_to: text
    requirement: >-
      Body text MUST meet WCAG AAA contrast (7:1). Large text and non-text
      elements MUST meet at least 4.5:1, in every theme.
    verify: "Check each text/background pair per theme against 7:1."
    standard: "WCAG 1.4.6"

  # --- Adding your own ---------------------------------------------------------
  # Use your own prefix. These have no baseline equivalent.

  - id: ACME-MOTION-BUDGET
    dimension: interaction
    applies_to: motion
    requirement: >-
      Transitions MUST use the system's duration tokens and MUST NOT exceed
      300ms. Anything longer reads as lag rather than as feedback.
    verify: "Every transition references a duration token within budget."
    standard: null

  - id: ACME-OVERLAY-CHOICE
    dimension: interaction
    applies_to: interactive
    requirement: >-
      Destructive confirmations MUST use Modal. Drawer is for non-blocking
      secondary content and MUST NOT be used to confirm an irreversible action.
    verify: "Each overlay's component matches the kind of decision it asks for."
    standard: null

  - id: ACME-ICON-LABELS
    dimension: accessibility
    applies_to: interactive
    requirement: >-
      Icon-only controls MUST carry a visible text label at `md` and above.
      Below `md` a tooltip plus accessible name is acceptable.
    verify: "Inspect icon-only controls at each breakpoint."
    standard: null

  - id: ACME-DENSITY
    dimension: tokens
    applies_to: layout
    requirement: >-
      A view MUST commit to one density scale throughout. Mixing compact and
      comfortable spacing within one screen MUST NOT happen.
    verify: "Spacing tokens in a view come from a single density scale."
    standard: null
